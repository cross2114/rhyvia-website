name: Publish RHYVIA website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check language selection
        run: node --test tests/language.test.cjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare site and check local links
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/prepare_pages.py --base-path "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
